[package]
name = "chat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
connectors.workspace = true
llm.workspace = true
tools.workspace = true
futures = "0.3.34"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "test-util"] }
