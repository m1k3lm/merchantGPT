[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "merchantgpt"
path = "src/main.rs"

[dependencies]
connectors.workspace = true
chat-core.workspace = true
llm.workspace = true
tools.workspace = true
store.workspace = true
skills.workspace = true
eframe = "0.37.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = "0.13.5"
serde_json = "1.0.154"
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
