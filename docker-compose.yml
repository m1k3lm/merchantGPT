services:
  dev:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - target:/app/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: cargo build

  # Local WooCommerce store for manual and live tests (opt-in):
  #   docker compose --profile woo up -d woo
  #   docker compose --profile woo run --rm woo-cli bash /scripts/woo-setup.sh
  woo-db:
    image: mariadb:11.4
    profiles: [woo]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    volumes:
      - woo-db:/var/lib/mysql

  woo:
    image: wordpress:7-php8.3-apache
    profiles: [woo]
    depends_on: [woo-db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - woo-html:/var/www/html

  woo-cli:
    image: wordpress:cli-php8.3
    profiles: [woo]
    depends_on: [woo]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      HOME: /tmp
    volumes:
      - woo-html:/var/www/html
      - ./scripts:/scripts:ro

  presta-db:
    image: mariadb:11.4
    profiles: [presta]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: presta
      MARIADB_USER: presta
      MARIADB_PASSWORD: presta
    volumes:
      - presta-db:/var/lib/mysql

  presta:
    # PRESTA_IMAGE can point at an already-pulled image built on the official one.
    image: ${PRESTA_IMAGE:-prestashop/prestashop:9.2-apache}
    profiles: [presta]
    depends_on: [presta-db]
    # The image's start script exits with an error right after a successful
    # first install (it removes an install folder the installer already removed).
    restart: on-failure:3
    ports:
      - "8081:80"
    environment:
      DB_SERVER: presta-db
      DB_NAME: presta
      DB_USER: presta
      DB_PASSWD: presta
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:8081
      PS_FOLDER_ADMIN: admin-dev
      PS_COUNTRY: es
      PS_LANGUAGE: en
      PS_ENABLE_SSL: 0
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: merchantgpt-admin
    volumes:
      - presta-html:/var/www/html
      - ./scripts:/scripts:ro

volumes:
  target:
  cargo-registry:
  cargo-git:
  woo-db:
  woo-html:
  presta-db:
  presta-html:
